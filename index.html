<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>태린 가계부</title>
<meta name="theme-color" content="#FFF6F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="태린 가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6F1; --card:#fff; --ink:#3B3340; --sub:#9A8F9E; --line:#F3E7E1;
  --tw:#7DB3E8; --tw-d:#3F86CC; --tw-bg:#EAF3FC;
  --yr:#F7A1B5; --yr-d:#E0607F; --yr-bg:#FFEEF2;
  --sum:#A796E8; --sum-d:#7B66D6; --sum-bg:#F1EEFD;
  --in:#2FA394; --out:#EE6C56;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.in{color:var(--in)} .out{color:var(--out)} .sv,.save{color:var(--sum-d)} .gf,.gift{color:#B5790A}
.gbar{display:flex;flex-direction:column;gap:2px;background:#FFF3D6;border-radius:var(--r);padding:10px 16px;margin-bottom:12px;font-size:13px;color:#8A6A2A}
.gbar b{font-size:15px;color:#7A5200}
.tag.gft{background:#FFF3D6;color:#B5790A}
.sum4{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.sum4 div{display:flex;justify-content:space-between;align-items:baseline}
.sum4 small{color:var(--sub);font-size:12px}
.sum4 b{font-size:16px;font-weight:700} .sub{color:var(--sub)}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.top h1{font-size:22px;margin:0;flex:1}
.top .logo{display:flex;align-items:center}
.top .logo svg{width:34px;height:34px}
.top .logo svg+svg{margin-left:-8px}
.sy{font-size:12px;white-space:nowrap}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:22px;background:#fff;border:1.5px solid var(--line);font-family:'Jua',sans-serif;font-size:16px;color:var(--sub)}
.chip svg{width:24px;height:24px}
.chip.on[data-w=all]{background:var(--sum);border-color:var(--sum);color:#fff}
.chip.on[data-w=tw]{background:var(--tw);border-color:var(--tw);color:#fff}
.chip.on[data-w=yr]{background:var(--yr);border-color:var(--yr);color:#fff}

.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(180,140,120,.08)}
.month{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 12px}
.month b{font-family:'Jua',sans-serif;font-weight:400;font-size:20px;min-width:120px;text-align:center}
.month button{width:40px;height:40px;border-radius:50%;background:#fff;border:1.5px solid var(--line);font-size:18px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum3 div+div{border-left:1px solid var(--line)}
.sum3 small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
.sum3 b{font-size:16px;font-weight:700}
.bubble{display:flex;align-items:center;gap:10px;background:var(--sum-bg);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:14px}
.bubble svg{width:40px;height:40px;flex:none}
.seg{display:flex;background:#F7EDE8;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;height:38px;border-radius:11px;color:var(--sub);font-family:'Jua',sans-serif;font-size:15px;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button svg{width:22px;height:22px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* list */
.day{padding:0;overflow:hidden}
.day-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.day-h .d{font-family:'Jua',sans-serif;font-size:24px;line-height:1}
.day-h .w{font-size:11px;padding:2px 7px;border-radius:8px;background:#F1ECEF;color:var(--sub)}
.day-h .w.sun{background:var(--yr-bg);color:var(--yr-d)} .day-h .w.sat{background:var(--tw-bg);color:var(--tw-d)}
.day-h .t{margin-left:auto;font-size:13px;display:flex;gap:10px}
.row{display:flex;align-items:center;gap:10px;padding:11px 16px;width:100%;text-align:left}
.row+.row{border-top:1px solid #FAF2EE}
.row .av svg{width:30px;height:30px;display:block}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{color:var(--sub);font-size:12px}
.row .amt{font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--sum-bg);color:var(--sum-d);margin-left:4px;vertical-align:1px}
.empty{text-align:center;padding:34px 10px;color:var(--sub)}
.empty svg{width:64px;height:64px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{text-align:center;font-size:12px;color:var(--sub);padding-bottom:6px}
.cal button{min-height:58px;border-radius:12px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px}
.cal button.sel{background:var(--sum-bg);outline:1.5px solid var(--sum)}
.cal button.today .n{background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px}
.cal button i{font-style:normal;font-size:9px;line-height:1.2;letter-spacing:-.3px}
.cal .sun .n,.cal .wd:first-child{color:var(--yr-d)} .cal .sat .n,.cal .wd:nth-child(7){color:var(--tw-d)}

/* stats */
.who2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.who2 .card{margin:0;padding:14px}
.who2 .hd{display:flex;align-items:center;gap:6px;font-family:'Jua',sans-serif;font-size:16px;margin-bottom:8px}
.who2 .hd svg{width:28px;height:28px}
.who2 p{margin:2px 0;display:flex;justify-content:space-between;font-size:13px}
.who2 p b{font-weight:700}
h2{font-family:'Jua',sans-serif;font-weight:400;font-size:17px;margin:0 0 10px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#F5EEEA;margin:8px 0}
.split span{display:block}
.legend{display:flex;justify-content:space-between;font-size:13px}
.donut{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.donut svg{width:120px;height:120px;flex:none}
.donut .tot small{color:var(--sub);font-size:12px;display:block}
.donut .tot b{font-size:20px}
.cat{width:100%;display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.cat .pc{min-width:42px;text-align:center;font-size:12px;color:#fff;border-radius:8px;padding:2px 0}
.cat .nm{flex:1;font-weight:700}
.cat .ar{color:var(--sub);font-size:12px}
.catd{background:#FDF8F5;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.catd .pl{display:flex;justify-content:space-between;padding:4px 0}
.catd .pl+.pl{border-top:1px dashed var(--line)}
.catd .hh{font-size:12px;color:var(--sub);margin:8px 0 2px}

/* tabbar & fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:8px 16px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.tabs nav{pointer-events:auto;display:flex;width:100%;max-width:448px;background:#fff;border-radius:26px;box-shadow:0 6px 24px rgba(150,110,90,.18);padding:6px}
.tabs button{flex:1;height:52px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub);gap:2px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--sum-bg);color:var(--sum-d)}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:50%;background:var(--out);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(238,108,86,.45)}

/* sheet */
.dim{position:fixed;inset:0;background:rgba(59,51,64,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .sh{display:flex;align-items:center;margin-bottom:12px}
.sheet .sh h2{flex:1;margin:0;font-size:19px}
.sheet .sh button{width:36px;height:36px;border-radius:50%;background:#fff;font-size:16px}
label.f{display:block;margin-bottom:12px}
label.f>span,.flabel{display:block;font-size:12px;color:var(--sub);margin:0 0 5px 4px}
label.f input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;outline:none}
label.f input:focus{border-color:var(--sum)}
label.f input.big{font-size:22px;font-weight:700;text-align:right}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cats button{padding:8px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:14px}
.cats button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cats button .x{margin-left:6px;color:var(--out)}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;height:52px;border-radius:16px;font-family:'Jua',sans-serif;font-size:17px;background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--out);border:1.5px solid var(--line);flex:0 0 96px}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.set .card button.li{display:flex;width:100%;align-items:center;padding:13px 0;text-align:left;gap:8px}
.set .card button.li+button.li{border-top:1px solid var(--line)}
.set .card button.li span{flex:1}
.set .card button.li em{font-style:normal;color:var(--sub);font-size:13px}
.note{font-size:12px;color:var(--sub);margin:6px 4px 0}

/* lock */
#lock{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#FFEEF2,#FFF6F1 45%,#EAF3FC);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#lock[hidden]{display:none}
#lock .duo{display:flex;align-items:center;gap:4px}
#lock .duo svg{width:92px;height:92px}
#lock .duo .h{font-size:26px;color:var(--yr-d);animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){#lock .duo .h{animation:none}}
#lock h1{font-size:30px;margin:10px 0 2px}
#lock p{margin:0 0 18px;color:var(--sub);text-align:center}
.dots{display:flex;gap:14px;margin-bottom:22px;height:16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--sum);display:block}
.dots i.on{background:var(--sum)}
.dots.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;background:#fff;font-family:'Jua',sans-serif;font-size:26px;box-shadow:0 2px 8px rgba(180,140,120,.12)}
.pad button.e{background:none;box-shadow:none;font-size:18px;color:var(--sub)}
.pick{display:flex;gap:14px}
.pick button{width:140px;padding:18px 0;border-radius:24px;background:#fff;font-family:'Jua',sans-serif;font-size:20px;box-shadow:0 2px 10px rgba(180,140,120,.14)}
.pick svg{width:84px;height:84px;display:block;margin:0 auto 6px}
</style>
</head>
<body>
<div id="lock"></div>
<div id="app"></div>
<div id="sheet"></div>
<script>
'use strict';
/* ───────── 캐릭터: 태곰이(태원) · 린토끼(예린) ───────── */
const FACE='<ellipse cx="23" cy="36" rx="3" ry="3.6" fill="#3B3340"/><ellipse cx="41" cy="36" rx="3" ry="3.6" fill="#3B3340"/><circle cx="24" cy="34.8" r="1" fill="#fff"/><circle cx="42" cy="34.8" r="1" fill="#fff"/><ellipse cx="16" cy="43" rx="4.5" ry="2.8" fill="#FF9DB0" opacity=".65"/><ellipse cx="48" cy="43" rx="4.5" ry="2.8" fill="#FF9DB0" opacity=".65"/>';
const CH={
  tw:'<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="13" cy="17" r="9" fill="#7DB3E8"/><circle cx="51" cy="17" r="9" fill="#7DB3E8"/><circle cx="13" cy="17" r="4.5" fill="#EAF3FC"/><circle cx="51" cy="17" r="4.5" fill="#EAF3FC"/><ellipse cx="32" cy="37" rx="26" ry="23" fill="#A9CFF3"/><ellipse cx="32" cy="44" rx="10" ry="7.5" fill="#F4FAFF"/>'+FACE+'<ellipse cx="32" cy="40.5" rx="3" ry="2.2" fill="#3B3340"/><path d="M32 42.5v3m0 0c-1.6 2-4 2-5 .6m5-.6c1.6 2 4 2 5 .6" stroke="#3B3340" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>',
  yr:'<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="21" cy="13" rx="6.5" ry="13" fill="#FBC0CE" transform="rotate(-10 21 13)"/><ellipse cx="43" cy="13" rx="6.5" ry="13" fill="#FBC0CE" transform="rotate(10 43 13)"/><ellipse cx="21" cy="14" rx="3" ry="8.5" fill="#FFE6EC" transform="rotate(-10 21 14)"/><ellipse cx="43" cy="14" rx="3" ry="8.5" fill="#FFE6EC" transform="rotate(10 43 14)"/><ellipse cx="32" cy="40" rx="25" ry="21" fill="#FDD3DD"/>'+FACE+'<path d="M30.4 41h3.2l-1.6 2z" fill="#E0607F"/><path d="M32 43v1.5m0 0c-1.4 1.8-3.6 1.8-4.6.5m4.6-.5c1.4 1.8 3.6 1.8 4.6.5" stroke="#3B3340" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M45 21c2-3 6-1 4.5 2.2L45 27l-4.5-3.8C39 20 43 18 45 21z" fill="#F58FA8"/></svg>'
};
const P={tw:{name:'태원',pet:'태곰이'},yr:{name:'예린',pet:'린토끼'}};
const WHO=['tw','yr'];
const PAL=['#F58FA8','#7DB3E8','#F6B756','#7FCDBB','#A796E8','#F2927C','#8FC47A','#E59AD3','#6CC3D9','#C9A27E','#B0A8B9','#F3D065'];

/* ───────── 데이터 ───────── */
const KEY='taerin-v1';
const DEF={v:1,pin:null,me:null,tx:[],fixed:[],catsUpd:0,
  cats:{out:['식비','생활용품','교통','주거·관리비','통신','보험','의료','경조사','계비','문화·여가','쇼핑','기타'],in:['월급','부수입','용돈','기타'],acct:['현금','국민은행','신한은행','우리은행','카카오뱅크','토스뱅크','신용카드'],save:['적금','예금','청약','투자','연금','비상금'],gift:['기프티콘','백화점상품권','문화상품권','지역화폐','기타']}};
let S=load();
['acct','save','gift'].forEach(k=>{if(!Array.isArray(S.cats[k])||!S.cats[k].length)S.cats[k]=DEF.cats[k].slice()});
/* 이미 쓰던 폰에도 새 기본 분류(계비)를 한 번만 넣어 준다 */
if(!S.m1){if(!S.cats.out.includes('계비')){const i=S.cats.out.indexOf('기타');S.cats.out.splice(i<0?S.cats.out.length:i,0,'계비')}S.m1=1;store()}
/* 저축(적금·예금 등)은 나가는 돈이지만 지출과 따로 센다 */
/* 상품권·기프티콘(받음/사용)은 수입·지출에 넣지 않고 따로 센다 */
const isGift=t=>t.kind==='gift',isIn=t=>t.type==='in'&&t.kind!=='gift';
const isSave=t=>t.type==='out'&&t.kind==='save',isOut=t=>t.type==='out'&&t.kind!=='save'&&t.kind!=='gift';
const TYN={out:'지출',in:'수입',save:'저축',gift:'상품권 사용'};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v)return Object.assign({},JSON.parse(JSON.stringify(DEF)),s)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function store(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('저장 공간이 부족해요')}}
function save(){store();schedulePush()}
const okBase=x=>x&&typeof x==='object'&&typeof x.id==='string'&&/^[\w-]{1,80}$/.test(x.id)&&typeof x.amount==='number'&&x.amount>=0&&(x.who==='tw'||x.who==='yr')&&typeof x.cat==='string';
const okTx=x=>okBase(x)&&/^\d{4}-\d\d-\d\d$/.test(x.date)&&(x.type==='in'||x.type==='out');
const okFix=x=>okBase(x)&&typeof x.name==='string'&&typeof x.day==='number'&&/^\d{4}-\d\d$/.test(x.start);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad2=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lastDay=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const shiftYm=(ym,d)=>{let[y,m]=ym.split('-').map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad2(m)};
const ymLabel=ym=>{const[y,m]=ym.split('-');return y+'년 '+Number(m)+'월'};
const catColor=(type,c)=>{const i=S.cats[type].indexOf(c);return PAL[(i<0?PAL.length-2:i)%PAL.length]};

/* 매달 고정지출 → 해당 월 내역으로 자동 생성 (두 폰에서 같은 id가 되도록 고정 id 사용) */
function ensureFixed(ym){
  if(ym>todayStr().slice(0,7))return;
  let ch=false;
  S.fixed.forEach(f=>{
    if(f.del||f.start>ym)return;
    const id='fx-'+f.id+'-'+ym;
    if(S.tx.some(t=>t.id===id))return;
    S.tx.push({id,type:'out',date:ym+'-'+pad2(Math.min(f.day,lastDay(ym))),who:f.who,cat:f.cat,acct:f.acct||'',amount:f.amount,place:f.name,memo:'',kind:f.save?'save':'fixed',upd:Date.now()});
    ch=true;
  });
  if(ch)save();
}
function monthTx(ym,who){return S.tx.filter(t=>!t.del&&t.date.slice(0,7)===ym&&(who==='all'||t.who===who))}
const sumOf=(a,f)=>a.reduce((s,t)=>s+(f(t)?t.amount:0),0);

/* ───────── 화면 상태 ───────── */
const ui={tab:'book',who:'all',ym:todayStr().slice(0,7),view:'cal',selDay:todayStr(),statType:'out',openCat:null};
let form=null,sheetKind=null,catType='out';
const $=s=>document.querySelector(s);

const ICON={
  book:'<svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M9 9h6M9 13h6"/></svg>',
  stat:'<svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',

function whoLabel(){return ui.who==='all'?'둘이 합쳐':P[ui.who].name+'님은'}
function vBook(){
  const tx=monthTx(ui.ym,ui.who);
  const inc=sumOf(tx,isIn),out=sumOf(tx,isOut),sv=sumOf(tx,isSave);
  const fx=sumOf(tx,t=>t.type==='out'&&t.kind==='fixed'),ex=out-fx;
  let h='<div class="card sum4"><div><small>수입</small><b class="in num">'+won(inc)+'</b></div><div><small>지출</small><b class="out num">'+won(out)+'</b></div><div><small>저축</small><b class="sv num">'+won(sv)+'</b></div><div><small>남은 돈</small><b class="num">'+won(inc-out-sv)+'</b></div></div>';
  const gAll=S.tx.filter(t=>!t.del&&isGift(t)&&(ui.who==='all'||t.who===ui.who));
  if(gAll.length){const bal=sumOf(gAll,x=>x.type==='in')-sumOf(gAll,x=>x.type==='out'),gi=sumOf(tx,x=>isGift(x)&&x.type==='in'),go=sumOf(tx,x=>isGift(x)&&x.type==='out');
    h+='<div class="gbar"><b>🎁 상품권 남은 금액 <span class="num">'+won(bal)+'</span></b><span>이번 달 받음 '+won(gi)+' · 사용 '+won(go)+'</span></div>'}
  h+='<div class="bubble">'+(ui.who==='yr'?CH.yr:CH.tw)+'<div>'+(tx.length?
    '이번 달 '+whoLabel()+' <b class="out">'+won(out)+'</b> 썼어요.<br><span class="sub">매달 고정 '+won(fx)+' · 추가 지출 '+won(ex)+(sv?' · 저축 '+won(sv):'')+'</span>':
    '아직 기록이 없어요. 아래 <b>+</b> 버튼으로 적어 볼까요?')+'</div></div>';
  h+='<div class="seg"><button class="'+(ui.view==='cal'?'on':'')+'" data-act="view" data-k="cal">달력</button><button class="'+(ui.view==='list'?'on':'')+'" data-act="view" data-k="list">일일</button></div>';
  if(ui.view==='cal'){h+=calendar(tx);h+=dayCards(ui.selDay?tx.filter(t=>t.date===ui.selDay):[],!!ui.selDay)}
  else h+=dayCards(tx,true);
  return h;
}
function dayCards(tx,showEmpty){
  if(!tx.length)return showEmpty?'<div class="empty">'+CH.yr+'<div>이 날짜엔 기록이 없어요</div></div>':'<p class="note" style="text-align:center">날짜를 누르면 그날 내역이 보여요</p>';
  const by={};tx.forEach(t=>(by[t.date]=by[t.date]||[]).push(t));
  return Object.keys(by).sort().reverse().map(d=>{
    const a=by[d].sort((x,y)=>y.upd-x.upd),dt=new Date(d+'T00:00:00'),w=dt.getDay();
    const i=sumOf(a,isIn),o=sumOf(a,isOut),v=sumOf(a,isSave);
    return '<div class="card day"><div class="day-h"><span class="d">'+Number(d.slice(8))+'</span><span class="w '+(w===0?'sun':w===6?'sat':'')+'">'+'일월화수목금토'[w]+'요일</span><span class="t">'+(i?'<span class="in num">+'+won(i)+'</span>':'')+(o?'<span class="out num">-'+won(o)+'</span>':'')+(v?'<span class="sv num">저축 '+won(v)+'</span>':'')+'</span></div>'+
      a.map(t=>'<button class="row" data-act="edit" data-id="'+t.id+'"><span class="av">'+CH[t.who]+'</span><span class="mid"><b>'+esc(t.place||t.cat)+(t.type==='out'&&(t.kind==='fixed'||t.id.startsWith('fx-'))?'<span class="tag">매달</span>':'')+(isSave(t)?'<span class="tag">저축</span>':'')+(isGift(t)?'<span class="tag gft">상품권 '+(t.type==='in'?'받음':'사용')+'</span>':'')+'</b><small>'+P[t.who].name+' · '+esc(t.cat)+(t.acct?' · '+esc(t.acct):'')+(t.memo?' · '+esc(t.memo):'')+'</small></span><span class="amt num '+(isGift(t)?'gf':isSave(t)?'sv':t.type)+'">'+(t.type==='in'?'+':'-')+won(t.amount)+'</span></button>').join('')+'</div>';
  }).join('');
}
function calendar(tx){
  const[y,m]=ui.ym.split('-').map(Number),first=new Date(y,m-1,1).getDay(),n=lastDay(ui.ym),td=todayStr();
  const by={};tx.forEach(t=>{const o=by[t.date]=by[t.date]||{in:0,out:0,sv:0,gf:0};o[isGift(t)?'gf':isSave(t)?'sv':t.type]+=t.amount});
  let h='<div class="card"><div class="cal">'+[...'일월화수목금토'].map(c=>'<div class="wd">'+c+'</div>').join('');
  for(let i=0;i<first;i++)h+='<span></span>';
  for(let d=1;d<=n;d++){const ds=ui.ym+'-'+pad2(d),w=(first+d-1)%7,o=by[ds];
    h+='<button class="'+(w===0?'sun ':w===6?'sat ':'')+(ds===td?'today ':'')+(ds===ui.selDay?'sel':'')+'" data-act="day" data-d="'+ds+'"><span class="n">'+d+'</span>'+(o&&o.in?'<i class="in num">+'+o.in.toLocaleString()+'</i>':'')+(o&&o.out?'<i class="out num">-'+o.out.toLocaleString()+'</i>':'')+(o&&o.sv?'<i class="sv num">'+o.sv.toLocaleString()+'</i>':'')+'</button>'}
  return h+'</div></div>';
}

function vStat(){
  const all=monthTx(ui.ym,'all'),tx=monthTx(ui.ym,ui.who),ty=ui.statType;
  let h='<div class="who2">'+WHO.map(w=>{const a=all.filter(t=>t.who===w),i=sumOf(a,isIn),o=sumOf(a,isOut),v=sumOf(a,isSave);
    return '<div class="card"><div class="hd">'+CH[w]+P[w].name+'</div><p><span class="sub">수입</span><b class="in num">'+won(i)+'</b></p><p><span class="sub">지출</span><b class="out num">'+won(o)+'</b></p><p><span class="sub">저축</span><b class="sv num">'+won(v)+'</b></p><p><span class="sub">남은 돈</span><b class="num">'+won(i-o-v)+'</b></p></div>'}).join('')+'</div>';
  const out=sumOf(tx,isOut),fx=sumOf(tx,t=>t.type==='out'&&t.kind==='fixed'),ex=out-fx;
  h+='<div class="card"><h2>매달 고정 vs 추가 지출 <small class="sub" style="font-family:inherit;font-size:12px">'+(ui.who==='all'?'합계':P[ui.who].name)+'</small></h2><div class="split"><span style="width:'+(out?fx/out*100:0)+'%;background:var(--sum)"></span><span style="width:'+(out?ex/out*100:0)+'%;background:var(--out)"></span></div><div class="legend"><span><b style="color:var(--sum-d)">●</b> 매달 고정 <b class="num">'+won(fx)+'</b></span><span><b class="out">●</b> 추가 <b class="num">'+won(ex)+'</b></span></div></div>';
  h+='<div class="seg"><button class="'+(ty==='out'?'on':'')+'" data-act="stype" data-k="out">지출</button><button class="'+(ty==='save'?'on':'')+'" data-act="stype" data-k="save">저축</button><button class="'+(ty==='gift'?'on':'')+'" data-act="stype" data-k="gift">상품권</button><button class="'+(ty==='in'?'on':'')+'" data-act="stype" data-k="in">수입</button></div>';
  const list=tx.filter(ty==='gift'?(x=>isGift(x)&&x.type==='out'):ty==='save'?isSave:ty==='out'?isOut:isIn),tot=sumOf(list,()=>true),g={};
  list.forEach(t=>(g[t.cat]=g[t.cat]||[]).push(t));
  const cats=Object.keys(g).map(c=>({c,a:g[c],s:sumOf(g[c],()=>true)})).sort((a,b)=>b.s-a.s);
  if(!cats.length)return h+'<div class="empty">'+CH.tw+'<div>이 달엔 '+TYN[ty]+' 기록이 없어요</div></div>';
  let off=25,arcs='';
  cats.forEach(o=>{const p=o.s/tot*100;arcs+='<circle cx="21" cy="21" r="15.915" fill="none" stroke="'+catColor(ty,o.c)+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+off+'"/>';off-=p});
  h+='<div class="card"><div class="donut"><svg viewBox="0 0 42 42">'+arcs+'</svg><div class="tot"><small>'+(ui.who==='all'?'태원 + 예린 합계':P[ui.who].name)+' '+TYN[ty]+'</small><b class="num '+ty+'">'+won(tot)+'</b></div></div>';
  cats.forEach(o=>{
    const open=ui.openCat===o.c;
    h+='<button class="cat" data-act="cat" data-c="'+esc(o.c)+'"><span class="pc" style="background:'+catColor(ty,o.c)+'">'+Math.round(o.s/tot*100)+'%</span><span class="nm">'+esc(o.c)+'</span><b class="num">'+won(o.s)+'</b><span class="ar">'+(open?'▲':'▼')+'</span></button>';
    if(open){
      const pl={};o.a.forEach(t=>{const k=t.place||'(내용 없음)';const x=pl[k]=pl[k]||{s:0,n:0,tw:0,yr:0};x.s+=t.amount;x.n++;x[t.who]+=t.amount});
      const tw=sumOf(o.a,t=>t.who==='tw'),yr=o.s-tw;
      h+='<div class="catd"><div class="legend"><span>'+P.tw.name+' <b class="num">'+won(tw)+'</b></span><span>'+P.yr.name+' <b class="num">'+won(yr)+'</b></span></div><div class="split"><span style="width:'+tw/o.s*100+'%;background:var(--tw)"></span><span style="width:'+yr/o.s*100+'%;background:var(--yr)"></span></div><div class="hh">어디서 얼마</div>'+
        Object.keys(pl).sort((a,b)=>pl[b].s-pl[a].s).map(k=>'<div class="pl"><span>'+esc(k)+' <span class="sub">'+pl[k].n+'건'+(ui.who==='all'&&pl[k].tw&&pl[k].yr?' · 태원 '+won(pl[k].tw)+' / 예린 '+won(pl[k].yr):ui.who==='all'?' · '+(pl[k].tw?'태원':'예린'):'')+'</span></span><b class="num">'+won(pl[k].s)+'</b></div>').join('')+'</div>';
    }
  });
  const ag={};list.forEach(t=>{const k=t.acct||'(선택 안 함)';ag[k]=(ag[k]||0)+t.amount});
  if(ty==='gift')return h+'</div>';
  h+='</div><div class="card"><h2>은행·카드별 '+TYN[ty]+'</h2>'+Object.keys(ag).sort((a,b)=>ag[b]-ag[a]).map(k=>'<div class="cat"><span class="pc" style="background:'+(k[0]==='('?'#B0A8B9':catColor('acct',k))+'">'+Math.round(ag[k]/tot*100)+'%</span><span class="nm">'+esc(k)+'</span><b class="num">'+won(ag[k])+'</b></div>').join('');
  return h+'</div>';
}

function exportData(){
  const data=JSON.stringify({app:'taerin',v:1,from:S.me,at:Date.now(),tx:S.tx,fixed:S.fixed,cats:S.cats});
  const name='태린가계부-'+P[S.me].name+'-'+todayStr().replace(/-/g,'')+'.json';
  const file=new File([data],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'태린 가계부'}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function mergeArr(mine,theirs){
  const m=new Map(mine.map(x=>[x.id,x]));let n=0;
  theirs.forEach(x=>{if(!x||!x.id)return;const o=m.get(x.id);if(!o||(x.upd||0)>(o.upd||0)){m.set(x.id,x);n++}});
  return[[...m.values()],n];
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='imp'||!e.target.files[0])return;
  try{
    const d=JSON.parse(await e.target.files[0].text());
    if(d.app!=='taerin'||!Array.isArray(d.tx))throw 0;
    const[tx,n1]=mergeArr(S.tx,d.tx.filter(okTx));
    const[fx,n2]=mergeArr(S.fixed,(d.fixed||[]).filter(okFix));

    save();render();alert('합치기 완료! 새로 반영된 기록 '+(n1+n2)+'건');
  }catch(_){alert('태린 가계부에서 내보낸 파일이 아니에요')}
  e.target.value='';
});

/* ───────── 실시간 동기화 (Firebase Realtime Database, REST + 스트리밍) ─────────
   두 폰이 /books/<비밀 방 번호> 아래의 같은 데이터를 본다. 방 번호는 48자리 난수라 연결 링크를 가진 사람만 접근할 수 있다.
   기록마다 수정 시각(upd)을 비교해 더 최근 것이 이긴다. 삭제는 del 표시로 전달된다. */
const SKEY=KEY+'-sync',MKEY=KEY+'-synced';
let SY=null,synced={},es=null,mirror=null,gotSnap=false,syState='wait',pushT=null,pushing=false,retryT=null;
try{SY=JSON.parse(localStorage.getItem(SKEY))}catch(_){}
try{synced=JSON.parse(localStorage.getItem(MKEY))||{}}catch(_){}
const DEVHOST=['localhost','127.0.0.1'].includes(location.hostname);
const okRoom=r=>/^[a-f0-9]{32,64}$/.test(r);
function cleanUrl(u){u=String(u||'').trim().replace(/\/+$/,'');
  if(/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i.test(u))return u;
  if(DEVHOST&&/^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(u))return u;
  return null}
const roomUrl=()=>SY.url+'/books/'+SY.room+'.json';
const pairCode=()=>SY?'TAERIN-'+btoa(SY.url+'|'+SY.room):'';
const joinLink=()=>location.origin+location.pathname+'#j='+pairCode();
function parseCode(s){
  try{const m=String(s||'').match(/TAERIN-([A-Za-z0-9+/=]+)/);const[u,r]=atob(m[1]).split('|');const url=cleanUrl(u);return url&&okRoom(r)?{url,room:r}:null}catch(_){return null}}
function saveSynced(){try{localStorage.setItem(MKEY,JSON.stringify(synced))}catch(_){}}
function syBadge(){if(!SY)return '';const m={on:['동기화 켜짐','var(--in)'],wait:['연결 중…','var(--sub)'],off:['오프라인','var(--sub)'],err:['연결 오류','var(--out)']}[syState];return '<span class="sy" style="color:'+m[1]+'">● '+m[0]+'</span>'}
function setSy(st){if(syState===st)return;syState=st;if(!lock)render()}
function syncConnect(c){SY=c;synced={};try{localStorage.setItem(SKEY,JSON.stringify(c))}catch(_){}saveSynced();syncStart()}
function syncDisconnect(){syncStop();SY=null;synced={};try{localStorage.removeItem(SKEY);localStorage.removeItem(MKEY)}catch(_){}}
function syncStop(){clearTimeout(pushT);clearTimeout(retryT);if(es){es.close();es=null}mirror=null;gotSnap=false;syState='wait'}
function setPath(path,val){
  const p=String(path).split('/').filter(Boolean);
  if(!p.length){mirror=val&&typeof val==='object'?val:{};return}
  let o=mirror;
  for(let i=0;i<p.length-1;i++){if(!o[p[i]]||typeof o[p[i]]!=='object')o[p[i]]={};o=o[p[i]]}
  if(val===null)delete o[p[p.length-1]];else o[p[p.length-1]]=val;
}
function syncStart(){
  syncStop();if(!SY||!window.EventSource)return;
  mirror={};
  const src=es=new EventSource(roomUrl());
  const on=(ev,patch)=>{
    if(es!==src)return;let d;try{d=JSON.parse(ev.data)}catch(_){return}
    if(!d||typeof d.path!=='string')return;
    if(patch){if(d.data&&typeof d.data==='object')Object.keys(d.data).forEach(k=>setPath(d.path+'/'+k,d.data[k]))}else setPath(d.path,d.data);
    gotSnap=true;pull();setSy('on');schedulePush()};
  src.addEventListener('put',e=>on(e,false));
  src.addEventListener('patch',e=>on(e,true));
  src.addEventListener('cancel',()=>{if(es===src)setSy('err')});
  src.onerror=()=>{if(es!==src)return;gotSnap=false;
    if(src.readyState===2){setSy(navigator.onLine===false?'off':'err');clearTimeout(retryT);retryT=setTimeout(syncStart,20000)}else setSy('off')};
}
function pull(){
  let ch=false;
  [['tx',okTx],['fixed',okFix]].forEach(([k,ok])=>{
    const r=mirror[k];if(!r||typeof r!=='object')return;
    Object.keys(r).forEach(id=>{
      const x=r[id];if(!x||typeof x!=='object'||typeof x.upd!=='number')return;
      const c=Object.assign({place:'',memo:''},x,{id});if(!ok(c))return;
      const i=S[k].findIndex(o=>o.id===id),o=S[k][i];
      if(!o||c.upd>(o.upd||0)){if(o)S[k][i]=c;else S[k].push(c);ch=true}
      if(!o||c.upd>=(o.upd||0))synced[k+'/'+id]=c.upd;
    });
  });
  const rc=mirror.cats,strs=a=>Array.isArray(a)?a.filter(s=>typeof s==='string'&&s).map(s=>s.slice(0,10)):[];
  if(rc&&typeof rc.upd==='number'){
    const o=strs(rc.out),n=strs(rc.in),a=strs(rc.acct),v=strs(rc.save),g=strs(rc.gift);
    if(o.length&&n.length){
      if(rc.upd>(S.catsUpd||0)){S.cats={out:o,in:n,acct:a.length?a:S.cats.acct,save:v.length?v:S.cats.save,gift:g.length?g:S.cats.gift};S.catsUpd=rc.upd;ch=true}
      if(rc.upd>=(S.catsUpd||0))synced.cats=rc.upd;
    }
  }
  saveSynced();
  if(ch){store();if(!lock)render()}
}
function schedulePush(){if(!SY)return;clearTimeout(pushT);pushT=setTimeout(push,400)}
async function push(){
  if(!SY||pushing||!gotSnap)return;
  const body={},marks={};
  ['tx','fixed'].forEach(k=>S[k].forEach(o=>{const key=k+'/'+o.id;if((o.upd||0)>(synced[key]||0)&&/^[\w-]{1,80}$/.test(o.id)){body[key]=o;marks[key]=o.upd}}));
  if((S.catsUpd||0)>(synced.cats||0)){body.cats={out:S.cats.out,in:S.cats.in,acct:S.cats.acct,save:S.cats.save,gift:S.cats.gift,upd:S.catsUpd};marks.cats=S.catsUpd}
  if(!Object.keys(body).length)return;
  pushing=true;const mine=SY;
  try{
    const r=await fetch(roomUrl(),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw 0;
    if(SY===mine){Object.assign(synced,marks);saveSynced()}
    pushing=false;schedulePush();
  }catch(_){pushing=false;clearTimeout(pushT);pushT=setTimeout(push,15000)}
}
window.addEventListener('online',()=>{if(SY)syncStart()});
document.addEventListener('visibilitychange',()=>{if(SY&&!document.hidden&&(!es||es.readyState===2))syncStart()});
/* 연결 링크(#j=코드)로 열었을 때 */
function checkJoinLink(){
  const m=location.hash.match(/^#j=(.+)$/);if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);
  const c=parseCode(decodeURIComponent(m[1]));
  if(!c)return alert('연결 링크가 올바르지 않아요.');
  if(SY&&SY.room===c.room)return;
  if(!confirm('받은 링크로 두 사람 가계부를 연결할까요?'+(SY?'\n(지금 연결된 동기화는 새 것으로 바뀌어요)':'')))return;
  syncConnect(c);render();
}

/* ───────── 잠금 (둘만 쓰는 비밀번호) ───────── */
let lock=null;
async function hash(pin){
  const s='taerin:'+pin;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h.toString(16);
}
function renderLock(bad){
  const L=$('#lock');
  if(!lock){L.hidden=true;L.innerHTML='';return}
  L.hidden=false;
  const head='<div class="duo">'+CH.tw+'<span class="h">♥</span>'+CH.yr+'</div><h1 class="jua">태린 가계부</h1>';
  if(lock.mode==='who'){L.innerHTML=head+'<p>이 폰은 누구 거예요?</p><div class="pick">'+WHO.map(w=>'<button data-who="'+w+'">'+CH[w]+P[w].name+'</button>').join('')+'</div>';return}
  const msg={enter:'태원 ♥ 예린, 둘만의 비밀번호를 눌러 주세요',set1:'둘만 아는 비밀번호 4자리를 정해 주세요',set2:'한 번 더 눌러 주세요'}[lock.mode];
  L.innerHTML=head+'<p>'+(bad||msg)+'</p><div class="dots'+(bad?' bad':'')+'">'+[0,1,2,3].map(i=>'<i class="'+(i<lock.buf.length?'on':'')+'"></i>').join('')+'</div><div class="pad">'+
    [1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join('')+'<button class="e" disabled></button><button data-k="0">0</button><button class="e" data-k="back" aria-label="지우기">←</button></div>';
}
$('#lock').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!lock)return;
  if(b.dataset.who){S.me=b.dataset.who;save();return unlock()}
  const k=b.dataset.k;if(k==null)return;
  if(k==='back'){lock.buf=lock.buf.slice(0,-1);return renderLock()}
  if(lock.buf.length>=4)return;
  lock.buf+=k;renderLock();
  if(lock.buf.length<4)return;
  const pin=lock.buf;lock.buf='';
  if(lock.mode==='enter'){if(await hash(pin)===S.pin)return unlock();return renderLock('비밀번호가 달라요. 다시 눌러 주세요')}
  if(lock.mode==='set1'){lock.first=pin;lock.mode='set2';return renderLock()}
  if(pin!==lock.first){lock.mode='set1';return renderLock('두 번이 서로 달라요. 처음부터 다시 정해 주세요')}
  S.pin=await hash(pin);save();
  if(!S.me){lock.mode='who';return renderLock()}
  unlock();
});
function unlock(){lock=null;try{sessionStorage.setItem(KEY+'-open','1')}catch(_){}renderLock();render();checkJoinLink()}

/* ───────── 시작 ───────── */
(function start(){
  let open=false;try{open=sessionStorage.getItem(KEY+'-open')==='1'}catch(_){}
  /* 비밀번호 잠금은 사용하지 않음: 처음 한 번 누구 폰인지만 고른다 */
  if(!S.me)lock={mode:'who',buf:''};
  renderLock();
  if(!lock){render();checkJoinLink()}
  if(SY)syncStart();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
